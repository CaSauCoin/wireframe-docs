site_name: WireFrame EDA Docs
site_url: https://wireframe.com.vn/docs
copyright: '© 2026 WireFrame EDA. All rights reserved.'

# Cấu hình giao diện Material
theme:
  name: material
  palette: 
    scheme: slate       # Chế độ tối (Dark mode)
    primary: cyan       # Màu chủ đạo neon cyan
    accent: cyan
  features:
    - navigation.tabs           # Menu ngang phía trên
    - navigation.sections       # Menu dọc tự động mở rộng
    - navigation.top            # Nút "Back to top"
    - navigation.expand         # Mở rộng menu
    - search.suggest            # Gợi ý khi tìm kiếm
    - search.highlight          # Highlight kết quả tìm
    - content.code.copy         # Nút copy code

# CSS tùy chỉnh (để giống app chính)
extra_css:
  - stylesheets/extra.css

# CẤU TRÚC MENU ĐIỀU HƯỚNG (Logic mới)
nav:
  - Home: index.md
  
  - Getting Started:
      - Introduction: getting-started.md
      - Installation: installation.md
      - UI Overview: ui-overview.md
      - Projects Management: projects.md

  - Schematic Design:
      - Overview: schematic/index.md
      - Placing Components: schematic/placing-components.md
      - Wiring & Nets: schematic/wiring-and-nets.md
      - Properties & Attributes: schematic/properties-and-attributes.md
      - Graphics & Annotations: schematic/graphics-and-annotations.md

  - PCB Layout:
      - Overview: pcb/index.md
      - Footprints & Placement: pcb/footprints-and-placement.md
      - Routing (Tracks & Vias): pcb/routing.md
      - Layers & Views: pcb/layers-and-views.md
      - Zones & Planes: pcb/zones-and-planes.md
      - DFM & DRC Check: pcb/dfm-and-drc.md
      - Fabrication & Export: pcb/fabrication-and-export.md

  - Libraries:
      - Symbols Library: libraries/symbols-library.md
      - Footprints Library: libraries/footprints-library.md

  - Advanced Features:
      - Selection & Editing: advanced/selection-and-editing.md
      - 3D Viewer: advanced/3d-viewer.md
      - Keyboard Shortcuts: advanced/shortcuts.md

  - Reference:
      - Config & Session: reference/config-and-session.md
      - File Formats: reference/file-formats.md

# Các plugin hỗ trợ Markdown
markdown_extensions:
  - admonition            # Để tạo các box Note/Warning đẹp
  - pymdownx.details      # Để tạo các đoạn text ẩn/hiện (Collapsible)
  - pymdownx.highlight:   # Tô màu code
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list             # Để chỉnh ảnh/table dễ hơn
  - md_in_html