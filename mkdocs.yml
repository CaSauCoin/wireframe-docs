site_name: WireFrame EDA Documentation
site_url: https://guideline-one.vercel.app/
site_description: >-
  Release-ready user guidelines for schematic capture, PCB layout, simulation,
  AI-assisted design, libraries, validation, and manufacturing output.
copyright: '© 2026 WireFrame EDA. All rights reserved.'

# Theme configuration (Material dark mode)
theme:
  name: material
  custom_dir: overrides
  language: en
  # Dark first (it is how the app looks); a toggle for daylight and print.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font: false
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - content.code.copy
    - content.tooltips
    - content.tabs.link
    - announce.dismiss
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

# Production briefs (the capture scripts doc_builder reads) stay in the
# Markdown but are left out of the built site — see the hook's docstring.
hooks:
  - hooks/hide_capture_briefs.py

# Custom CSS
extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/learn.js

# Extra configuration
extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://wireframe.com.vn
      name: WireFrame Website (wireframe.com.vn)
    - icon: fontawesome/brands/github
      link: https://github.com/CaSauCoin/WireFrame_Product
      name: WireFrame on GitHub
  generator: false

# Plugins
plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
        - wf-no-zoom

# Navigation structure
nav:
  - Home: index.md

  - Start Here:
      - Learning Paths: learn/index.md
      - "Tutorial: A Simple LED Board": tutorial/index.md
      - "Tutorial: AI-Assisted Design": tutorial/ai-design.md

  - Getting Started:
      - Installation: installation.md
      - Introduction: getting-started.md
      - UI Overview: ui-overview.md
      - Projects & Files: projects.md

  - Schematic Design:
      - schematic/index.md
      - Placing Components: schematic/placing-components.md
      - Wiring & Nets: schematic/wiring-and-nets.md
      - Properties & Attributes: schematic/properties-and-attributes.md
      - Graphics & Annotations: schematic/graphics-and-annotations.md
      - ERC (Electrical Rules Check): schematic/erc.md
      - Templates & Title Block: schematic/templates.md

  - Simulation:
      - Simulation Workbench: simulation/index.md
      - Running a Simulation: simulation/running-simulation.md
      - Waveform Viewer: simulation/waveform-viewer.md
      - Testbenches & Measurements: simulation/testbenches-and-measurements.md
      - Engines & SPICE Models: simulation/engines-and-models.md

  - AI Copilot:
      - AI Overview: ai/index.md
      - AI Design Agent: ai/design-agent.md
      - Placement & Routing Assistant: ai/auto-placer-router.md
      - AI Component Generator: ai/component-generator.md
      - Review & Simulation Guide: ai-copilot.md

  - PCB Layout:
      - pcb/index.md
      - Footprints & Placement: pcb/footprints-and-placement.md
      - Routing (Tracks & Vias): pcb/routing.md
      - Layers & Views: pcb/layers-and-views.md
      - Zones & Planes: pcb/zones-and-planes.md
      - Design Rules & Net Classes: pcb/design-rules.md
      - DFM & DRC Check: pcb/dfm-and-drc.md
      - Fabrication & Export: pcb/fabrication-and-export.md

  - Libraries:
      - Symbols Library: libraries/symbols-library.md
      - Footprints Library: libraries/footprints-library.md
      - Symbol Library Editor: libraries/symbol-creator.md
      - Library Import & Management: libraries/library-converter.md

  - Advanced Features:
      - Selection, Context Menus & Popups: advanced/selection-and-editing.md
      - 3D Viewer: advanced/3d-viewer.md
      - Keyboard Shortcuts: advanced/shortcuts.md

  - Reference:
      - Config & Session: reference/config-and-session.md
      - File Formats: reference/file-formats.md
      - Release Media Production: reference/media-production.md
      - FAQ & Troubleshooting: faq.md
      - Changelog: changelog.md



# Markdown extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.keys
