site_name: WireFrame EDA Documentation
site_url: https://wireframe.com.vn/docs/
site_description: >-
  Complete user guide for WireFrame EDA — a lightweight schematic and PCB design
  environment built with ImGui, GLFW and OpenGL.
copyright: '© 2026 WireFrame EDA. All rights reserved.'

# Theme configuration (Material dark mode)
theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: cyan
    accent: cyan
  font:
    text: Roboto
    code: JetBrains Mono
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Extra configuration
extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CaSauCoin/WireFrame_Product
      name: WireFrame on GitHub
  generator: false

# Plugins
plugins:
  - search

# Navigation structure
nav:
  - Home: index.md

  - Getting Started:
      - Installation: installation.md
      - Introduction: getting-started.md
      - UI Overview: ui-overview.md
      - Projects & Files: projects.md

  - Schematic Design:
      - schematic/index.md
      - Placing Components: schematic/placing-components.md
      - Wiring & Nets: schematic/wiring-and-nets.md
      - Properties & Attributes: schematic/properties-and-attributes.md
      - Graphics & Annotations: schematic/graphics-and-annotations.md

  - PCB Layout:
      - pcb/index.md
      - Footprints & Placement: pcb/footprints-and-placement.md
      - Routing (Tracks & Vias): pcb/routing.md
      - Layers & Views: pcb/layers-and-views.md
      - Zones & Planes: pcb/zones-and-planes.md
      - DFM & DRC Check: pcb/dfm-and-drc.md
      - Fabrication & Export: pcb/fabrication-and-export.md

  - Libraries:
      - Symbols Library: libraries/symbols-library.md
      - Footprints Library: libraries/footprints-library.md

  - Advanced Features:
      - Selection & Editing: advanced/selection-and-editing.md
      - 3D Viewer: advanced/3d-viewer.md
      - Keyboard Shortcuts: advanced/shortcuts.md

  - Reference:
      - Config & Session: reference/config-and-session.md
      - File Formats: reference/file-formats.md
      - FAQ & Troubleshooting: faq.md
      - Changelog: changelog.md

  - Tutorial: tutorial/index.md


# Markdown extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.keys
