# The order of the user guide and the words on its home page.
#
# The guide is drawn by the website (wireframe-auth/app/docs_site.py) with the
# site's own header, footer and theme, and published at
# https://wireframe.com.vn/docs/. A page's URL is its path here:
#   pcb/routing.md -> /docs/pcb/routing/      pcb/index.md -> /docs/pcb/
#
# A page is listed as a path, or as {page, title, status} when the sidebar
# should call it something shorter than its H1 or mark it new / beta.
# A page that exists but is not listed is not published.

home:
  title: WireFrame EDA Documentation
  lead: >-
    How to design a board in WireFrame, from the first sheet to the Gerbers you
    send to the fab — schematic capture, PCB layout, high-speed and power
    integrity, SPICE simulation, 3D, multi-board products, libraries, and an AI
    Copilot that shows its work.
  chips:
    - {title: Install, page: installation.md}
    - {title: Route a trace, page: pcb/routing.md}
    - {title: Export Gerbers, page: pcb/fabrication-and-export.md}
    - {title: High-Speed Workbench, page: high-speed/index.md}
    - {title: IR drop, page: power/power-analyzer.md}
    - {title: Copilot commands, page: ai/commands.md}
    - {title: Keyboard shortcuts, page: advanced/shortcuts.md}
  start:
    - title: Install and sign in
      text: Windows, macOS on Apple Silicon or Linux — the installer, the first launch and the account.
      page: installation.md
      icon: download
      cta: Install
    - title: Your first board
      text: A small LED board from an empty project to Gerber files, step by step, in about an hour.
      page: tutorial/index.md
      icon: pcb
      cta: Start the tutorial
    - title: Design with the AI Copilot
      text: Describe the circuit; review real parts, a checked netlist and the sheets it draws.
      page: tutorial/ai-design.md
      icon: ai
      cta: Try it
  tasks:
    - {title: Import a KiCad project, page: projects.md}
    - {title: Run the Electrical Rules Check, page: schematic/erc.md}
    - {title: Send the schematic to the board, page: projects.md}
    - {title: Draw the board outline, page: pcb/board-outline.md}
    - {title: Pour a ground plane, page: pcb/zones-and-planes.md}
    - {title: Set net classes and clearances, page: pcb/design-rules.md}
    - {title: Fix DRC and DFM findings, page: pcb/dfm-and-drc.md}
    - {title: Simulate a block of a sheet, page: simulation/running-simulation.md}
    - {title: Find or create a part, page: libraries/how-parts-are-found.md}
    - {title: Repair a part with /fix, page: ai/component-generator.md}
    - {title: Fit the board to its case, page: advanced/enclosure-and-assembly.md}
    - {title: Read the 3D view, page: advanced/3d-viewer.md}
    - {title: Match lengths of a bus, page: pcb/length-tuning.md}
    - {title: Check USB or Ethernet routing, page: high-speed/checks-and-interfaces.md#interfaces}
    - {title: Find where a rail loses voltage, page: power/power-analyzer.md}
    - {title: Open an Altium project, page: import-export.md}
    - {title: Export to KiCad or Altium, page: import-export.md#export-to-another-eda-tool}
    - {title: Build one variant of the board, page: pcb/design-variants.md#build-a-variant}
    - {title: Keep a circuit and place it again, page: schematic/design-blocks.md}
    - {title: Lay out one channel and repeat it, page: schematic/design-blocks.md#repeat-a-channels-layout}
    - {title: See what an edit broke, page: live-checks.md}
    - {title: Connect a HAT to a Raspberry Pi, page: advanced/multi-board.md}

